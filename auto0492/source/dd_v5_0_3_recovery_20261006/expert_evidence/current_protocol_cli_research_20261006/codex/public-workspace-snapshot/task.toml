schema_version = "1.3"
artifacts = [{ source = "/logs/artifacts" }]

[task]
name = "autoresearch/distilled-decoding-1"
version = "5.0.2-candidate"
description = "Optimize genuine VAR teacher sample policies and FM time sampling for a frozen single-step ImageNet-256 DD student."
authors = [{ name = "AutoResearch Expert" }]
keywords = ["distilled-decoding", "teacher-sampling", "flow-matching", "autoresearch"]

[metadata]
category = "generative-models"
difficulty_explanation = "Method design under a charged four-hour teacher and training budget, measured by the frozen official FID-50k procedure."

[verifier]
timeout_sec = 82800.0
network_mode = "no-network"
environment_mode = "separate"

[[verifier.collect]]
command = "mkdir -p /logs/artifacts/solution && test ! -L /logs/artifacts/solution && test -f /workspace/solution/method.py && test ! -L /workspace/solution/method.py && cp --remove-destination -- /workspace/solution/method.py /logs/artifacts/solution/method.py"
service = "main"
timeout_sec = 30.0

[verifier.environment]
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0
gpu_types = []

[agent]
network_mode = "public"
timeout_sec = 86400.0

[environment]
os = "linux"
network_mode = "public"
gpus = 0
gpu_types = []
cpus = 2
memory_mb = 2048
storage_mb = 4096
build_timeout_sec = 3600.0

[environment.env]
DD_GPU_EXECUTION = "external-controlled-A100"
