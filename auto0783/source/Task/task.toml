version = "1.0"
artifacts = ["/workspace/solution/program.json", "/workspace/solution/method.py"]

[task]
name = "local-research/bifrost-patch-latent-decoder"
version = "0.2.0"
description = "Pretrained patch-latent decoder execution graph optimization"

[metadata]
name = "bifrost-patch-latent-decoder"
difficulty = "hard"
category = "autoresearch"
tags = ["multimodal", "inference", "tensor-graph", "patch-latents"]

[agent]
timeout_sec = 172800
user = "1000:1000"
network_mode = "no-network"

[environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 2048
storage_mb = 2048
gpus = 0
network_mode = "no-network"
workdir = "/workspace/solution"

[verifier]
timeout_sec = 10800
user = "1000:1000"
network_mode = "no-network"
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 1024
storage_mb = 1024
gpus = 0
network_mode = "no-network"
workdir = "/workspace/solution"
